<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{header :: headerFragment}"></head>

<body>
    <div class="app-layout">
        <aside class="sidebar d-none d-lg-flex" th:replace="~{layout :: sidebarFragment}"></aside>
        <div th:replace="~{layout :: sidebarOffcanvasFragment}"></div>
        <div class="main-content">
            <header th:replace="~{layout :: topbarFragment('Rental Item Availability Report')}"></header>
            <div class="content-wrapper">
                <div class="card mb-3">
                    <div class="card-header title">
                        <div class="row align-items-center">
                            <div class="col text-start">
                                <h2 class="table-title"><i class="fa-solid fa-truck me-2"></i>Rental Item Availability
                                    Report</h2>

                                <p class="text-muted mb-0">
                                    Report Date :
                                    <span id="reportDate"></span>
                                </p>
                            </div>
                            <div class="col text-end header-actions">
                                <button type="button" class="btn btn-outline-secondary" onclick="printReport()"><i
                                        class="fa-solid fa-print me-1"></i>Print</button>
                                <button type="button" class="btn btn-outline-success" onclick="exportCSV()"><i
                                        class="fa-solid fa-download me-1"></i>Export CSV</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h6 class="text-muted">Filtered Items</h6>
                                <h3 id="totalItems">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h6 class="text-muted">Available Items</h6>
                                <h3 id="availableItems">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h6 class="text-muted">Currently Rented</h6>
                                <h3 id="rentedItems">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h6 class="text-muted">Available Rental Value</h6>
                                <h3 id="totalRentalValue">Rs. 0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Category</label>
                                <select id="filterCategory" class="form-select" onchange="applyFilters()">
                                    <option value="">All</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Status</label>
                                <select id="filterStatus" class="form-select" onchange="applyFilters()">
                                    <option value="">All</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button type="button" class="btn btn-secondary w-100"
                                    onclick="clearFilters()">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="row m-2">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <table class="modern-table">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Item Code</th>
                                            <th>Item Name</th>
                                            <th>Category</th>
                                            <th>Rental Price</th>
                                            <th>Key Money</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBodyRentals" class="tablebody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{footer :: footerFragment}"></div>
    <script src="/js/report_rental_items.js"></script>
</body>

</html>
